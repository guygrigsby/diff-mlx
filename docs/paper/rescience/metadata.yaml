# Don't forget to surround abstract with double quotes
# NOTE: numbers here restate generated/summary_macros.tex values; if the
# evidence regenerates differently, resync this abstract by hand.
abstract: "The Differential Transformer reports consistent gains over standard
           attention at 3B parameters and 1T tokens. We test whether the
           mechanism helps at the scale a single laptop can reach. We
           reimplement differential attention in MLX on Apple Silicon with
           custom Metal kernels, verify it against the official PyTorch
           reference at 1e-7 and replicate the training run in PyTorch on
           NVIDIA CUDA to rule out framework artifacts. Every comparison is
           paired. Both variants start from byte-identical shared weights and
           see identical data order, so a single-run delta is meaningful. At
           30M parameters and 100M tokens, four rerun seeds put the paired
           val-loss delta at -0.016 +/- 0.023 nats with a sign flip across
           seeds, and the originally recorded single-seed win sits inside that
           band. A single-seed win of the size we first observed is seed
           noise. At 162M parameters and 2.0B tokens, differential attention
           wins train loss by -0.111 nats yet loses held-out validation by
           +0.035 nats, with a late-run overfitting signature. Binning
           held-out loss by token position shows vanilla uniformly ahead
           across the whole 2048-token window, so the long-context advantage
           the mechanism is built for does not appear. These results sit
           three orders of magnitude below the paper's setting and refute
           nothing about it. They show no benefit in the small-scale,
           short-context regime. All code, kernels, training logs and checkpoints are released."

